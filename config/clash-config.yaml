# Clash 配置文件 - 完整版（含地区策略组+图标，无订阅）
# 规则集: blackmatrix7/ios_rule_script
# 适配: Clash Apple 原生客户端 / mihomo
# 节点: 请在 proxies 段添加，策略组会自动引用

mixed-port: 7890
allow-lan: true
bind-address: "0.0.0.0"
mode: rule
log-level: info
ipv6: true
# 统一延迟计算（消除握手延迟差异，测速更准）
unified-delay: true
# TCP 并发连接（同时尝试多个 IP，选最快的）
tcp-concurrent: true
# 进程匹配模式（iOS 上 Hako 强制 off，Apple 不允许枚举其他进程）
find-process-mode: off

external-controller: 127.0.0.1:9090

# DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "mensura.cdn-apple.com"
    - "*.mensura.cdn-apple.com"
    - "*.cdn-apple.com"
    - "*.aaplimg.com"
    - "*.voipgate.com"
    # 网络连通性测试（对齐 Surge always-real-ip）
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
    # 游戏（主机/PC 联网检测，fake-ip 会不兼容）
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "*.xboxlive.com"
    # 暴雪/战网
    - "*.battlenet.com.cn"
    - "*.battlenet.com"
    - "*.blzstatic.cn"
    - "*.battle.net"
    # STUN/穿透
    - "*.turn.twilio.com"
    - "*.stun.twilio.com"
    - "stun.syncthing.net"
    - "stun.*"
    # 本地 IP 反向映射（开发/诊断常用）
    - "*.sslip.io"
    - "*.nip.io"
  nameserver-policy:
    "+.aaplimg.com":
      - 223.5.5.5
      - 119.29.29.29
    "+.cdn-apple.com":
      - 223.5.5.5
      - 119.29.29.29
    "+.voipgate.com":
      - 223.5.5.5
      - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - 223.5.5.5
    - 119.29.29.29
  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4

# 节点列表（请在此处添加你的节点，或使用 proxy-providers 订阅）
proxies: []

# 订阅代理节点提供者（可选，支持 Clash YAML 格式的订阅链接）
# proxy-providers:
#   机场名称:
#     type: http
#     url: "你的订阅链接"           # 需返回 Clash YAML 格式，部分机场需加 &flag=clash
#     interval: 86400                # 自动更新间隔（秒）
#     path: ./providers/airport.yaml
#     health-check:
#       enable: true
#       url: http://www.gstatic.com/generate_204
#       interval: 300

# 策略组使用订阅节点时，把 use: - 机场名称 加到对应策略组即可
# 示例：- {name: "PROXY", type: select, use: [机场名称], proxies: ["♻️ 自动选择", "🇯🇵 日本节点"]}

# 规则集提供者
# 顺序与 rules 匹配段完全对齐：广告 → 局域网 → AI → 苹果 → 微软 → Telegram → 游戏 → 流媒体 → 国内直连补充 → 境外兜底 → 国内四层防线
rule-providers:
  # ==== 广告拦截/隐私保护/域名劫持 ====
  # 自建：广告拦截补充 (mickeu/Clash)
  AdvertisingSupplement:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/mickeu/Clash/main/ruleset/Advertising_Supplement.yaml"
    path: ./ruleset/Advertising_Supplement.yaml
    interval: 86400
  Advertising:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.yaml"
    path: ./ruleset/Advertising.yaml
    interval: 86400
  Hijacking:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Hijacking/Hijacking.yaml"
    path: ./ruleset/Hijacking.yaml
    interval: 86400
  Privacy:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Privacy/Privacy.yaml"
    path: ./ruleset/Privacy.yaml
    interval: 86400

  # ==== 局域网直连 ====
  Lan:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml"
    path: ./ruleset/Lan.yaml
    interval: 86400

  # ==== AI 服务 ====
  # 自建：Apple Intelligence 走代理 (mickeu/Clash)
  AppleIntelligence:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/mickeu/Clash/main/ruleset/AppleIntelligence.yaml"
    path: ./ruleset/AppleIntelligence.yaml
    interval: 86400
  OpenAI:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml"
    path: ./ruleset/OpenAI.yaml
    interval: 86400
  Claude:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.yaml"
    path: ./ruleset/Claude.yaml
    interval: 86400
  Gemini:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml"
    path: ./ruleset/Gemini.yaml
    interval: 86400

  # ==== 苹果服务（在 AI 之后，避免 Apple Intelligence 域名被吞走直连）====
  Apple:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.yaml"
    path: ./ruleset/Apple.yaml

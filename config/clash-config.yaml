# Clash 配置文件 - 完整版（无订阅）
# 规则集: blackmatrix7/ios_rule_script
# 适配: Clash Apple 原生客户端 / mihomo
# 节点: 请在 proxies 段添加

mixed-port: 7890
allow-lan: false
bind-address: "0.0.0.0"
mode: rule
log-level: info
ipv6: false

external-controller: 127.0.0.1:9090

# DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "mensura.cdn-apple.com"
    - "*.mensura.cdn-apple.com"
    - "*.cdn-apple.com"
    - "*.aaplimg.com"
    - "*.voipgate.com"
  nameserver-policy:
    "+.aaplimg.com":
      - 223.5.5.5
      - 119.29.29.29
    "+.cdn-apple.com":
      - 223.5.5.5
      - 119.29.29.29
    "+.voipgate.com":
      - 223.5.5.5
      - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - 223.5.5.5
    - 119.29.29.29
  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4

# 节点列表（请在此处添加你的节点）
proxies:
